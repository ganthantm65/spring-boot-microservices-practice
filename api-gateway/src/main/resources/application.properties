spring.application.name=api-gateway
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.cloud.gateway.server.webmvc.routes[0].id=user-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.server.webmvc.routes[1].id=quiz-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://QUIZ-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/quizzes/**,/api/questions/**